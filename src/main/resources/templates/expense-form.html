<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ClearSpend - Gasto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem auto; max-width: 640px; padding: 0 1rem; color: #222; }
        label { display: block; margin-top: 1rem; font-weight: bold; }
        input, select { width: 100%; box-sizing: border-box; padding: .6rem; margin-top: .3rem; }
        .actions { margin-top: 1.5rem; display: flex; gap: .75rem; }
        button, a { padding: .6rem .9rem; }
    </style>
</head>
<body>
<h1 th:text="${expense.id == null ? 'Registrar gasto' : 'Editar gasto'}"></h1>

<form th:action="@{/expenses}" th:object="${expense}" method="post">
    <input type="hidden" th:field="*{id}"/>

    <label for="date">Fecha</label>
    <input id="date" type="date" th:field="*{date}" required/>

    <label for="category">Categoría</label>
    <select id="category" th:field="*{category}" required>
        <option th:each="category : ${categories}" th:value="${category}" th:text="${category.label}"></option>
    </select>

    <label for="amount">Importe</label>
    <input id="amount" type="number" step="0.01" min="0" th:field="*{amount}" required/>

    <label for="description">Concepto</label>
    <input id="description" type="text" th:field="*{description}" required/>

    <div class="actions">
        <button type="submit">Guardar</button>
        <a th:href="@{/expenses}">Cancelar</a>
    </div>
</form>
</body>
</html>
